name: docker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build --tag llm4rec:ci .
      - name: Run container tests and fixture pipeline
        run: |
          docker run --rm -e OMP_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 -e HF_HUB_OFFLINE=1 llm4rec:ci sh -ec '
            python -m compileall -q llm4rec scripts run_chat.py
            python -m unittest discover -s tests
            make smoke-movielens
            python scripts/check_secrets.py
          '
