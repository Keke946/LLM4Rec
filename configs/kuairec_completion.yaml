# Frozen before additional model fitting; previous primary results remain unchanged.
seed: 42
protocol: global_temporal
features: data/features/kuairec_strict_trend1500
neural_rankers:
  models: [embedding_mlp, deepfm, din]
  epochs: 10
  patience: 2
  learning_rate: 0.001
  embedding_dim: 32
  batch_size: 1024
  max_history_len: 50
  max_train_rows: 700000
  max_val_rows: 500000
  dense_transform: log1p
  exclude_injected_positives: true
neural_retrievers:
  models: [bpr, two_tower, lightgcn, sasrec]
  epochs: 10
  embedding_dim: 32
  batch_size: 1024
  max_history_len: 50
negative_sampling:
  strategies: [random_negative, exposed_low_watch_negative, retrieved_hard_negative, mixed_negative]
  negatives_per_positive: 20
  model: lambdarank
  n_estimators: 120
semantic_retrieval:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  input: official captions and existing category metadata
  require_backend: faiss
business_reranking:
  modes: [none, diversity, diversity_tail]
  input_head: 100
  output_k: 100
evaluation:
  candidate_pool_k: 1500
  cutoffs: [5, 10, 20, 50, 100]
  rerank_scopes: [full, top50, top100]
