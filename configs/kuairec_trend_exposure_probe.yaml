dataset: kuairec
role: trend_exposure_gbdt_probe
paths:
  processed_dir: data/processed/kuairec
  features_dir: data/features/kuairec_trend_exposure1500_ltr
  retriever_dir: models/kuairec/retrievers
  ranker_root: models/kuairec_trend_exposure1500_ltr
features:
  max_history_len: 50
retrieval:
  retrievers: [trend, exposure]
  source_weights:
    trend: 1.2
    exposure: 0.8
ranking:
  rankers: [gbdt]
  gbdt:
    train_split: val
    val_split: test
    max_iter: 100
    learning_rate: 0.08
    max_leaf_nodes: 31
    l2_regularization: 0.05
    max_train_rows: 500000
    max_val_rows: 500000
evaluation:
  candidate_pool_k: 1500
  cutoffs: [5, 10, 20, 50, 100]
  final_top_k: 10
  filter_seen_splits: [train, val]
  rerank_mode: ranker_only
  rerankers: [none]
